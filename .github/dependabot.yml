# Dependabot configuration.
# The "npm" ecosystem covers pnpm — Dependabot reads pnpm-lock.yaml (there is no
# package-lock.json in this repo; it was removed during the pnpm migration).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Batch low-risk dev/tooling bumps into a single PR to reduce noise.
      dev-dependencies:
        dependency-type: "development"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
