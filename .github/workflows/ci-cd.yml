name: CI/CD

on:
  pull_request:
  push:
    branches: [dev, prod]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# gitleaks-action lists PR commits via the API on pull_request events; without
# pull-requests:read the default token returns 403 "Resource not accessible".
permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    name: Type-check, Lint, Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 11.4.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm prisma generate

      - run: pnpm tsc --noEmit

      - run: pnpm lint

      - name: Secret scanning
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  test:
    name: Unit + Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: csquared_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/csquared_test
      NEXTAUTH_SECRET: test-secret
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm prisma generate

      - run: pnpm prisma migrate deploy

      - run: pnpm test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  migrate-dev:
    name: Migrate dev DB (Neon)
    runs-on: ubuntu-latest
    # Push to dev only: apply pending migrations to the Neon database that the
    # Vercel dev deployment serves. Vercel's build runs `next build` only (no
    # migrate), and the prod migrate lives in the prod-only deploy job below —
    # so without this step the dev DB drifts behind the schema on every migration.
    if: github.event_name == 'push' && github.ref_name == 'dev'
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm prisma generate

      - name: Apply database migrations (dev / Neon)
        # DEV_DATABASE_URL must be Neon's DIRECT (unpooled) connection string — the
        # pooled/PgBouncer endpoint can reject DDL. A failed migration fails this job
        # (surfaced on the dev push) but does not block Vercel's independent deploy.
        run: pnpm prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}

  dependency-audit:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      # Fails on high-severity advisories by design (security signal). This job is
      # NOT a required status check (branch protection gates on quality + test only),
      # so a red audit surfaces vulnerabilities without blocking merges.
      # Highs are currently clear: vite pinned >=8.0.16 (devDep) and hono >=4.12.25
      # (pnpm-workspace overrides). Remaining advisories are moderate/low only.
      - run: pnpm audit --audit-level=high

  image:
    name: Build, Scan & Push Image
    runs-on: ubuntu-latest
    # Ship images only from the integration/production branches, never from PRs.
    if: github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'prod')
    needs: [quality, test]
    permissions:
      contents: read
      id-token: write # mint the OIDC token for Workload Identity Federation
      security-events: write # upload Trivy SARIF to the Security tab
    env:
      IMAGE: ${{ vars.AR_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPO }}/csquared-cms
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.AR_REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v4

      - name: Docker metadata (tags + OCI labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # Immutable per-commit tag (full SHA, so the scan ref below is deterministic)
          # plus a moving branch tag (:dev / :prod).
          tags: |
            type=raw,value=${{ github.sha }}
            type=ref,event=branch

      - name: Build image (load locally so we can scan before pushing)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan — fail on CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library

      - name: Trivy report — SARIF (CRITICAL/HIGH/MEDIUM, non-blocking)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"
          ignore-unfixed: true

      - name: Upload Trivy SARIF to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: "0"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
          retention-days: 90

      - name: Push scanned image to Artifact Registry
        # Only reached if the CRITICAL gate passed. Pushes every tag metadata-action
        # generated (full-SHA + branch); the image was loaded locally during build.
        run: |
          echo "${{ steps.meta.outputs.tags }}" | while IFS= read -r tag; do
            [ -n "$tag" ] && docker push "$tag"
          done

  deploy:
    name: Deploy to Cloud Run (prod)
    runs-on: ubuntu-latest
    # Prod only: build/scan/push happens for dev too, but only prod deploys.
    if: github.event_name == 'push' && github.ref_name == 'prod'
    needs: [image]
    permissions:
      contents: read
      id-token: write # mint the OIDC token for Workload Identity Federation
    env:
      IMAGE: ${{ vars.AR_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPO }}/csquared-cms
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Apply database migrations (prod)
        # The prod DB is a public-IP Cloud SQL instance (csq-cms-prod) with no
        # authorized networks, so the runner connects through the Cloud SQL Auth
        # Proxy. The CI-specific DATABASE_URL secret already points at the local
        # proxy (127.0.0.1:5432), so no runtime URL rewriting is required.
        run: |
          curl -sSfo cloud-sql-proxy \
            https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.1/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --port 5432 \
            "${{ vars.GCP_PROJECT_ID }}:${{ vars.AR_REGION }}:csq-cms-prod" &
          for i in $(seq 1 15); do nc -z 127.0.0.1 5432 && break; sleep 1; done

          export DATABASE_URL="$(
            gcloud secrets versions access latest \
              --secret=cms-prod-database-url-ci \
              --project=${{ vars.GCP_PROJECT_ID }}
          )"
          pnpm prisma migrate deploy

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: cms-prod
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.AR_REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          env_vars_update_strategy: overwrite
          # Replace the full secret set each deploy (--set-secrets, not merge) so a secret
          # removed here (e.g. the optional APP_PASSWORD) doesn't linger on the service from
          # a prior revision's spec and break the revision.
          secrets_update_strategy: overwrite
          secrets: |
            DATABASE_URL=cms-prod-database-url:latest
            NEXTAUTH_SECRET=cms-prod-nextauth-secret:latest
            KEYCLOAK_CLIENT_SECRET=cms-prod-keycloak-client-secret:latest
            KEYCLOAK_ADMIN_CLIENT_SECRET=cms-prod-keycloak-admin-client-secret:latest
            RESEND_API_KEY=cms-prod-resend-api-key:latest
            GOOGLE_SERVICE_ACCOUNT_KEY=cms-prod-google-service-account-key:latest
            CRON_SECRET=cms-prod-cron-secret:latest
          env_vars: |
            AUTH_TRUST_HOST=true
            NEXTAUTH_URL=${{ vars.PROD_NEXTAUTH_URL }}
            KEYCLOAK_ISSUER=${{ vars.PROD_KEYCLOAK_ISSUER }}
            KEYCLOAK_CLIENT_ID=${{ vars.PROD_KEYCLOAK_CLIENT_ID }}
            KEYCLOAK_ADMIN_CLIENT_ID=${{ vars.PROD_KEYCLOAK_ADMIN_CLIENT_ID }}
            EMAIL_FROM=${{ vars.PROD_EMAIL_FROM }}
            SMTP_USER=${{ vars.PROD_SMTP_USER }}
            GDRIVE_SHARED_DRIVE_ID=${{ vars.PROD_GDRIVE_SHARED_DRIVE_ID }}
            GDRIVE_ROOT_FOLDER_ID=${{ vars.PROD_GDRIVE_ROOT_FOLDER_ID }}
          # deploy-cloudrun@v3 has no `service_account` input — set the runtime SA via gcloud
          # flags so the service runs as cms-run-prod (github-ci has serviceAccountUser on it),
          # not the default compute SA (which github-ci cannot actAs).
          flags: "--allow-unauthenticated --service-account=cms-run-prod@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com"

      - name: Show deployed URL
        run: echo "Deployed cms-prod -> ${{ steps.deploy.outputs.url }}"
