# Force patched version of a transitive (dev-only) dep flagged high by `pnpm audit`:
#   hono (via @prisma/dev, shadcn/MCP) — GHSA-88fw-hqm2-52qc (patched >=4.12.25)
# vite is pinned directly in package.json devDependencies (the >= override here did not
# re-resolve under pnpm 11.4.0; a direct dep does — GHSA-fx2h-pf6j-xcff, patched >=8.0.16).
# Collapse the duplicate google-auth-library copies (direct 10.7.0 vs @googleapis/drive's
# transitive 10.5.0) onto one version so drive.ts's GoogleAuth type matches the drive client
# (the two copies' private fields are nominally incompatible, breaking `next build`).
overrides:
  hono: '>=4.12.25'
  google-auth-library: '10.7.0'
  # Patched transitive deps flagged moderate by `pnpm audit`:
  #   @hono/node-server (via @prisma/dev) — GHSA-92pp-h63x-v22m (middleware bypass)
  #   postcss (via next) — GHSA-qx2v-qp2m-jg93 (XSS via unescaped </style>)
  '@hono/node-server': '>=1.19.13'
  postcss: '>=8.5.10'

allowBuilds:
  '@prisma/engines': true
  cpu-features: true
  esbuild: true
  msw: false
  prisma: true
  protobufjs: true
  sharp: true
  ssh2: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@hono/node-server@1.19.13'
  - postcss@8.5.10
  - esbuild@0.28.1
  - protobufjs@7.6.3
  - js-yaml@4.1.2
  - undici@7.28.0
  - nodemailer@9.0.1
